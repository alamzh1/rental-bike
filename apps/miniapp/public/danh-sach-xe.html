<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Danh sách xe máy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
/* Một cột cho điện thoại: mỗi mẫu xe là một dòng, phía dưới là tổng số và nút sao chép. */
:root {
  --bg: #ffffff; --surface: #f2f3f5; --line: #e3e5e9; --line-strong: #7e838c;
  --ink: #15161b; --muted: #666a73; --accent: #0a5cff; --on-accent: #ffffff;
  --accent-text: #0a5cff; --ok: #117a45; --danger: #c21f33;
  --font: Manrope, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0f12; --surface: #1a1b20; --line: #34363d; --line-strong: #6e727b;
  --ink: #f2f3f5; --muted: #9b9fa8; --accent-text: #7aa5ff; --ok: #4cc488; --danger: #ff7a8a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e0f12; --surface: #1a1b20; --line: #34363d; --line-strong: #6e727b;
  --ink: #f2f3f5; --muted: #9b9fa8; --accent-text: #7aa5ff; --ok: #4cc488; --danger: #ff7a8a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--font); }
main {
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
.lead { color: var(--muted); margin-top: 8px; }
label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.opt { font-weight: 500; color: var(--muted); }
input {
  width: 100%; height: 48px; padding: 0 12px; font: 500 16px var(--font); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line-strong); border-radius: 12px;
}
input::placeholder { color: var(--muted); opacity: 1; }
input[aria-invalid="true"] { border-color: var(--danger); }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }
#rows { display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; padding: 0; }
.row { background: var(--surface); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) 172px; gap: 12px; }
.row .model { grid-column: 1 / -1; }
.field { min-width: 0; }
.stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 4px; }
.stepper input { text-align: center; padding: 0; font-weight: 800; font-variant-numeric: tabular-nums; }
.row-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
button { font: 700 16px var(--font); cursor: pointer; border: 0; border-radius: 12px; min-height: 48px; }
.step { background: var(--bg); color: var(--ink); border: 1px solid var(--line-strong); font-size: 22px; line-height: 1; }
.err { color: var(--danger); font-size: 14px; min-height: 0; }
.link { background: none; color: var(--danger); min-height: 44px; padding: 0 4px; font-size: 14px; }
.add { width: 100%; background: var(--surface); color: var(--accent-text); }
.primary { width: 100%; min-height: 56px; background: var(--accent); color: var(--on-accent); }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; font-weight: 700; }
.total b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
#status { font-weight: 700; color: var(--ok); }
#status.bad { color: var(--danger); }
textarea {
  width: 100%; min-height: 150px; padding: 12px; resize: vertical; font: 500 15px/1.5 var(--font); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.send { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 340px) { .row { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { button { transition: opacity 150ms; } button:active { opacity: .7; } }
</style>
</head>
<body style="margin:0">
<main>
  <header>
    <h1>Danh sách xe máy của anh/chị</h1>
    <p class="lead">Điền mẫu xe và số lượng, sau đó sao chép danh sách và gửi cho tôi qua WhatsApp. Chỉ mất khoảng 2 phút.</p>
  </header>

  <form id="form" novalidate>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div>
        <label for="point">Tên cửa hàng hoặc tên của anh/chị</label>
        <input id="point" autocomplete="organization" maxlength="100" placeholder="Ví dụ: Xe máy Nguyễn Huệ">
      </div>

      <ul id="rows"></ul>
      <button type="button" id="add" class="add">+ Thêm mẫu xe khác</button>

      <div class="total"><span>Tổng số xe</span><b id="total">0</b></div>

      <div class="send">
        <button type="submit" class="primary">Sao chép danh sách</button>
        <p id="status" role="status" hidden></p>
        <div id="result" hidden>
          <label for="text">Danh sách để gửi</label>
          <textarea id="text" readonly></textarea>
        </div>
      </div>
    </div>
  </form>

  <datalist id="models">
    <option value="Honda Vision"><option value="Honda Air Blade"><option value="Honda Lead"><option value="Honda SH Mode">
    <option value="Honda Wave Alpha"><option value="Honda Winner X"><option value="Yamaha NVX"><option value="Yamaha Janus">
    <option value="Yamaha Grande"><option value="Yamaha Exciter"><option value="Yamaha Sirius"><option value="VinFast Evo200">
    <option value="VinFast Klara"><option value="VinFast Feliz"><option value="Suzuki Raider">
  </datalist>
</main>

<script>
(function () {
  var KEY = 'danh-sach-xe-draft';
  var rowsEl = document.getElementById('rows');
  var pointEl = document.getElementById('point');
  var totalEl = document.getElementById('total');
  var statusEl = document.getElementById('status');
  var resultEl = document.getElementById('result');
  var textEl = document.getElementById('text');
  var seq = 0;

  function el(tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }

  function addRow(data, focus) {
    var id = ++seq;
    var model = el('input', { id: 'model-' + id, list: 'models', maxlength: '60', autocomplete: 'off', placeholder: 'Ví dụ: Honda Vision' });
    var year = el('input', { id: 'year-' + id, inputmode: 'numeric', maxlength: '4', autocomplete: 'off', placeholder: 'Ví dụ: 2023' });
    var qty = el('input', { id: 'qty-' + id, inputmode: 'numeric', maxlength: '3', autocomplete: 'off', 'aria-label': 'Số lượng' });
    var minus = el('button', { type: 'button', class: 'step', 'aria-label': 'Giảm số lượng', text: '−' });
    var plus = el('button', { type: 'button', class: 'step', 'aria-label': 'Tăng số lượng', text: '+' });
    var err = el('p', { class: 'err', role: 'alert' });
    var del = el('button', { type: 'button', class: 'link', text: 'Xóa dòng này' });
    err.hidden = true;
    model.value = (data && data.model) || '';
    year.value = (data && data.year) || '';
    qty.value = (data && data.qty) || '1';

    var li = el('li', { class: 'row' }, [
      el('div', { class: 'field model' }, [el('label', { for: model.id, text: 'Mẫu xe' }), model]),
      el('div', { class: 'field' }, [
        (function () { var l = el('label', { for: year.id, text: 'Đời xe ' }); l.appendChild(el('span', { class: 'opt', text: '(nếu biết)' })); return l; })(),
        year
      ]),
      el('div', { class: 'field' }, [el('label', { for: qty.id, text: 'Số lượng' }), el('div', { class: 'stepper' }, [minus, qty, plus])]),
      el('div', { class: 'row-foot' }, [err, del])
    ]);
    li.style.gridTemplateColumns = '';

    function setQty(n) { qty.value = String(Math.min(999, Math.max(1, n))); changed(); }
    minus.addEventListener('click', function () { setQty(toQty(qty.value) - 1); });
    plus.addEventListener('click', function () { setQty(toQty(qty.value) + 1); });
    del.addEventListener('click', function () {
      li.remove();
      if (!rowsEl.children.length) addRow();
      changed();
    });
    rowsEl.appendChild(li);
    if (focus) model.focus();
  }

  function toQty(v) { var n = parseInt(String(v).replace(/\D/g, ''), 10); return n > 0 ? n : 0; }

  function read() {
    return Array.prototype.map.call(rowsEl.children, function (li) {
      var i = li.querySelectorAll('input');
      return { model: i[0].value.trim(), year: i[1].value.replace(/\D/g, ''), qty: toQty(i[2].value) };
    });
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ point: pointEl.value, rows: read() })); } catch (e) { /* bản nháp là tùy chọn */ }
  }

  function changed() {
    totalEl.textContent = String(read().reduce(function (s, r) { return s + (r.model ? r.qty : 0); }, 0));
    statusEl.hidden = true;
    resultEl.hidden = true;
    save();
  }

  function buildText(point, rows) {
    var total = rows.reduce(function (s, r) { return s + r.qty; }, 0);
    var lines = ['DANH SÁCH XE MÁY'];
    if (point) lines.push('Cửa hàng: ' + point);
    rows.forEach(function (r, i) {
      lines.push((i + 1) + '. ' + r.model + (r.year ? ', đời ' + r.year : '') + ': ' + r.qty + ' xe');
    });
    lines.push('Tổng: ' + total + ' xe');
    return lines.join('\n');
  }

  function say(msg, bad) {
    statusEl.textContent = msg;
    statusEl.className = bad ? 'bad' : '';
    statusEl.hidden = false;
  }

  function validate() {
    var ok = true, first = null, filled = 0;
    Array.prototype.forEach.call(rowsEl.children, function (li) {
      var i = li.querySelectorAll('input'), err = li.querySelector('.err');
      var model = i[0].value.trim(), qty = toQty(i[2].value), empty = !model && !i[1].value.trim();
      var msg = '';
      if (rowsEl.children.length > 1 && empty) { err.hidden = true; i[0].removeAttribute('aria-invalid'); return; }
      if (!model) msg = 'Hãy nhập tên mẫu xe.';
      else if (!qty) msg = 'Hãy nhập số lượng.';
      err.textContent = msg;
      err.hidden = !msg;
      if (msg) {
        ok = false;
        i[!model ? 0 : 2].setAttribute('aria-invalid', 'true');
        first = first || i[!model ? 0 : 2];
      } else {
        i[0].removeAttribute('aria-invalid');
        i[2].removeAttribute('aria-invalid');
        filled++;
      }
    });
    if (first) first.focus();
    return ok && filled > 0;
  }

  function selectText() { textEl.focus(); textEl.select(); }

  rowsEl.addEventListener('input', changed);
  pointEl.addEventListener('input', changed);
  document.getElementById('add').addEventListener('click', function () { addRow(null, true); changed(); });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!validate()) { say('Vui lòng kiểm tra các dòng được đánh dấu.', true); return; }
    var text = buildText(pointEl.value.trim(), read().filter(function (r) { return r.model; }));
    textEl.value = text;
    resultEl.hidden = false;
    var manual = function () {
      selectText();
      say('Hãy chọn và sao chép đoạn văn bên dưới, rồi gửi cho tôi qua WhatsApp.', true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        say('Đã sao chép. Bây giờ hãy mở WhatsApp, dán vào tin nhắn và gửi cho tôi.');
      }, manual);
    } else manual();
  });

  var draft = null;
  try { draft = JSON.parse(localStorage.getItem(KEY)); } catch (e) { draft = null; }
  if (draft && Array.isArray(draft.rows) && draft.rows.length) {
    pointEl.value = draft.point || '';
    draft.rows.forEach(function (r) { addRow(r); });
  } else addRow();
  totalEl.textContent = String(read().reduce(function (s, r) { return s + (r.model ? r.qty : 0); }, 0));
})();
</script>
</body>
</html>
