<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ReviewCard</title></head>
<body class="br-app">
<div class="br-reviews">
  <article class="br-review">
    <div class="br-review__head"><span class="br-avatar">АК</span><div class="br-stack" style="gap:0"><span class="body-strong">Анна К.</span><span class="caption br-muted">3 ноября · 5 дней</span></div><span class="br-rating" style="margin-left:auto"><span class="br-i br-i-star br-i--sm" aria-hidden="true"></span>5.0</span></div>
    <p class="br-review__text">Привезли байк в отель за 20 минут. Чистый, два шлема, бак полный. Депозит вернули сразу при сдаче.</p>
  </article>
  <article class="br-review">
    <div class="br-review__head"><span class="br-avatar">MT</span><div class="br-stack" style="gap:0"><span class="body-strong">Minh T.</span><span class="caption br-muted">28 октября · 1 день</span></div><span class="br-rating" style="margin-left:auto"><span class="br-i br-i-star br-i--sm" aria-hidden="true"></span>4.0</span></div>
    <p class="br-review__text">Xe chạy êm, giao đúng giờ. Mũ bảo hiểm hơi rộng.</p>
  </article>
</div>
</body>
</html>
