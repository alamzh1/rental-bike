<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chip</title></head>
<body class="br-app">
<div class="br-stack">
  <div class="br-chips br-chips--scroll" role="group" aria-label="Категория">
    <button class="br-chip" type="button" aria-pressed="true">Все</button>
    <button class="br-chip" type="button" aria-pressed="false">Скутер 110–125</button>
    <button class="br-chip" type="button" aria-pressed="false">Макси-скутер 150+</button>
    <button class="br-chip" type="button" aria-pressed="false">Полуавтомат</button>
    <button class="br-chip" type="button" aria-pressed="false">Электро</button>
  </div>
  <div class="br-chips" role="group" aria-label="Тип КПП">
    <button class="br-chip br-chip--option" type="button" aria-pressed="true">Автомат</button>
    <button class="br-chip br-chip--option" type="button" aria-pressed="false">Полуавтомат</button>
    <button class="br-chip br-chip--option" type="button" aria-pressed="false">Механика</button>
  </div>
</div>
</body>
</html>
