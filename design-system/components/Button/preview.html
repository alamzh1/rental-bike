<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button</title></head>
<body class="br-app">
<div class="br-stack">
  <button class="br-btn br-btn--primary br-btn--lg br-btn--block" type="button">Забронировать <span class="br-i br-i-arrow-right" aria-hidden="true"></span></button>
  <div class="br-row">
    <button class="br-btn br-btn--inverse" type="button">Показать 12 байков</button>
    <button class="br-btn br-btn--secondary" type="button">Сбросить</button>
    <button class="br-btn br-btn--ghost" type="button">Все отзывы</button>
  </div>
  <div class="br-row">
    <button class="br-btn br-btn--primary br-btn--sm" type="button">Забронировать</button>
    <button class="br-btn br-btn--primary br-btn--sm br-btn--square" type="button" aria-label="Открыть"><span class="br-i br-i-arrow-right" aria-hidden="true"></span></button>
    <button class="br-btn br-btn--primary br-btn--sm" type="button" disabled>Нет на эти даты</button>
  </div>
</div>
</body>
</html>
