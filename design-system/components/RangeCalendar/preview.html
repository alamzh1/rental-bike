    <button class="br-chip br-chip--option" type="button">Выдача 10:00</button>
    <button class="br-chip br-chip--option" type="button">Возврат 10:00</button>
  </div>
  <div class="br-cal__sum">
    <span class="body-strong">7 дней · 12–19 ноября</span>
    <span class="price">910 000 ₫</span>
  </div>
</div>
