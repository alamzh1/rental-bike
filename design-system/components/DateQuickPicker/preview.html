<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DateQuickPicker</title></head>
<body class="br-app">
<div class="br-dates">
  <span class="headline">Когда нужен байк?</span>
  <div class="br-chips br-chips--scroll" role="group" aria-label="Быстрый выбор срока">
    <button class="br-chip" type="button" aria-pressed="false">Сегодня</button>
    <button class="br-chip" type="button" aria-pressed="false">Завтра</button>
    <button class="br-chip" type="button" aria-pressed="false">3 дня</button>
    <button class="br-chip" type="button" aria-pressed="true">Неделя</button>
    <button class="br-chip" type="button" aria-pressed="false">Месяц</button>
  </div>
  <button class="br-dates__range" type="button">
    <span class="br-i br-i-calendar" aria-hidden="true"></span>
    <span><span class="body-strong">12 ноя, 10:00 → 19 ноя, 10:00</span></span>
    <span class="br-muted caption">7 дней</span>
  </button>
  <span class="br-dates__loc"><span class="br-i br-i-pin br-i--sm" aria-hidden="true"></span> Дананг, точка Ми Кхе · 08:00–20:00</span>
</div>
</body>
</html>
