<!-- @dsCard group="Бронь" height=372 width=390 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BookingCard</title></head>
<body class="br-app">
<div class="br-stack">
  <article class="br-booking">
    <div class="br-booking__top"><span class="caption br-muted">BK-24117</span><span class="br-badge br-badge--accent">Подтверждена</span></div>
    <div class="br-booking__main">
      <span class="br-photo" role="img" aria-label="Honda Air Blade 125"></span>
      <div class="br-stack" style="gap:2px;min-width:0"><span class="headline">Honda Air Blade 125</span><span class="caption br-muted">12 ноя, 10:00 → 19 ноя, 10:00</span><span class="body-strong">1 149 000 ₫</span></div>
    </div>
    <div class="br-booking__timer"><span class="br-i br-i-clock br-i--sm" aria-hidden="true"></span> До выдачи 14 д 6 ч</div>
    <div class="br-booking__actions">
      <button class="br-btn br-btn--secondary br-btn--sm" type="button">Как добраться</button>
      <button class="br-btn br-btn--secondary br-btn--sm" type="button">Связаться</button>
      <button class="br-btn br-btn--ghost br-btn--sm" type="button">Отменить</button>
    </div>
  </article>
  <article class="br-booking">
    <div class="br-booking__top"><span class="caption br-muted">BK-24118</span><span class="br-badge br-badge--warning">Ожидает оплаты</span></div>
    <div class="br-booking__main">
      <span class="br-photo" role="img" aria-label="Yamaha NVX 155"></span>
      <div class="br-stack" style="gap:2px;min-width:0"><span class="headline">Yamaha NVX 155</span><span class="caption br-muted">2 дек, 09:00 → 5 дек, 09:00</span><span class="body-strong">660 000 ₫</span></div>
    </div>
    <div class="br-booking__timer" style="color:var(--warning)"><span class="br-i br-i-clock br-i--sm" aria-hidden="true"></span> Бронь держится ещё 14:32</div>
    <button class="br-btn br-btn--primary br-btn--block" type="button">Оплатить 660 000 ₫</button>
  </article>
</div>
</body>
</html>
