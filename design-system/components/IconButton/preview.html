<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IconButton</title></head>
<body class="br-app">
<div class="br-row">
  <button class="br-iconbtn" type="button" aria-label="Назад"><span class="br-i br-i-chevron-left" aria-hidden="true"></span></button>
  <button class="br-iconbtn br-iconbtn--inverse" type="button" aria-label="Фильтры"><span class="br-i br-i-sliders" aria-hidden="true"></span></button>
  <button class="br-iconbtn br-iconbtn--surface" type="button" aria-label="Связаться с менеджером"><span class="br-i br-i-chat" aria-hidden="true"></span></button>
  <button class="br-iconbtn br-iconbtn--float" type="button" aria-label="В избранное" aria-pressed="false"><span class="br-i br-i-heart br-i--sm" aria-hidden="true"></span></button>
  <button class="br-iconbtn br-iconbtn--float" type="button" aria-label="Убрать из избранного" aria-pressed="true"><span class="br-i br-i-heart-fill br-i--sm" aria-hidden="true"></span></button>
</div>
</body>
</html>
