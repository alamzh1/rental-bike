<!-- @dsCard group="Каталог" height=300 width=390 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BikeCard</title></head>
<body class="br-app">
<div class="br-grid">
  <article class="br-bike">
    <span class="br-photo" role="img" aria-label="Honda Air Blade 125"></span>
    <div class="br-bike__top">
      <span class="br-rating"><span class="br-i br-i-star br-i--sm" aria-hidden="true"></span>4.9</span>
      <button class="br-iconbtn br-iconbtn--float" type="button" aria-label="В избранное" aria-pressed="true"><span class="br-i br-i-heart-fill br-i--sm" aria-hidden="true"></span></button>
    </div>
    <div class="br-bike__body">
      <span class="br-bike__name">Honda Air Blade 125</span>
      <span class="br-bike__meta">2024 · 125 см³ · Автомат</span>
      <div class="br-bike__foot">
        <div>
          <div class="br-bike__price">130 000 ₫<small> /день</small></div>
          <div class="br-bike__total">910 000 ₫ за 7 дней</div>
        </div>
        <button class="br-btn br-btn--primary br-btn--sm br-btn--square" type="button" aria-label="Забронировать Honda Air Blade 125"><span class="br-i br-i-arrow-right" aria-hidden="true"></span></button>
      </div>
    </div>
  </article>
  <article class="br-bike br-bike--busy">
    <span class="br-photo" role="img" aria-label="Yamaha NVX 155"></span>
    <div class="br-bike__top">
      <span class="br-rating"><span class="br-i br-i-star br-i--sm" aria-hidden="true"></span>4.7</span>
      <button class="br-iconbtn br-iconbtn--float" type="button" aria-label="В избранное" aria-pressed="false"><span class="br-i br-i-heart br-i--sm" aria-hidden="true"></span></button>
    </div>
    <div class="br-bike__body">
      <span class="br-bike__name">Yamaha NVX 155</span>
      <span class="br-bike__meta">2023 · 155 см³ · Автомат</span>
      <div class="br-bike__foot">
        <div>
          <div class="br-bike__price">220 000 ₫<small> /день</small></div>
          <span class="br-badge br-badge--warning br-badge--plain">Занят до 21.11</span>
        </div>
      </div>
    </div>
  </article>
</div>
</body>
</html>
